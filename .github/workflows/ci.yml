name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Verify formatting
        run: test -z "$(gofmt -l pkg)"

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Verify Next.js excerpt
        run: npm --prefix frontend run verify

      - name: Install Electron excerpt dependencies
        run: npm --prefix electron ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Verify Electron excerpt
        run: npm --prefix electron run verify
